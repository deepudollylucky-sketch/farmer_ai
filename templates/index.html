<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farmer Helper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="page-shell">
    <div class="hero-card">
      <div class="brand-row">
        <span class="brand-icon">🌾</span>
        <h1>Farmer Helper</h1>
      </div>
      <p class="subtitle">Simple crop recommendations for Karnataka farmers</p>
    </div>

    <form id="farm-form" class="farm-form" action="{{ url_for('recommendations_page') }}" method="post">
      <div class="section-block">
        <div class="section-header">
          <span class="section-icon pin">📍</span>
          <h2>Farm Location</h2>
        </div>
        <p class="helper-text">Tell us where your farm is located.</p>

        <label>
          <span>District</span>
          <select id="district" name="district" required>
            {% for district in districts %}
              <option value="{{ district }}" {% if district == 'Hassan' %}selected{% endif %}>{{ district }}</option>
            {% endfor %}
          </select>
        </label>

        <label>
          <span>Taluk</span>
          <input id="taluk" name="taluk" type="text" value="hassan" />
        </label>

        <label>
          <span>Village</span>
          <input id="village" name="village" type="text" value="malali" class="focused" />
        </label>
      </div>

      <div class="section-block">
        <div class="section-header">
          <span class="section-icon land">🌱</span>
          <h2>Land Information</h2>
        </div>

        <div class="inline-row">
          <label class="half">
            <span>Land Area</span>
            <div class="value-wrap">
              <input id="land-area" name="landArea" type="number" step="0.1" min="0.1" value="4.8" required />
              <span class="unit">Acres</span>
            </div>
          </label>
        </div>

        <label>
          <span>Soil Type</span>
          <select id="soil-type" name="soilType">
            <option selected>Black Soil</option>
            <option>Red Soil</option>
            <option>Loamy Soil</option>
            <option>Sandy Soil</option>
          </select>
        </label>

        <label>
          <span>Water Availability</span>
          <select id="water-availability" name="waterAvailability">
            <option selected>Some Water Available</option>
            <option>Plenty of Water</option>
            <option>Limited Water</option>
            <option>No Water</option>
          </select>
        </label>
      </div>

      <button type="submit" id="market-price-btn" class="primary-button">Continue to crop recommendations</button>
    </form>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  </div>
</body>
</html>
